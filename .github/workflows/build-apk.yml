name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Unsigned APK
        run: |
          mkdir -p build/gen build/obj build/bin assets/web
          cp -r web/* assets/
          cp -r web/* assets/web/
          export ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          
          echo "=== 1. Compiling Android Resources ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m \
            -J build/gen \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -I $ANDROID_JAR
          
          echo "=== 2. Compiling Java Source Files ==="
          find android/app/src/main/java build/gen -name "*.java" > sources.txt
          javac -d build/obj \
            -classpath $ANDROID_JAR \
            -source 1.8 -target 1.8 \
            @sources.txt
          
          echo "=== 3. Converting Bytecode to DEX ==="
          find build/obj -name "*.class" > classes.txt
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --output build/bin/ \
            --lib $ANDROID_JAR \
            $(cat classes.txt)
          
          echo "=== 4. Packaging Unaligned APK ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -A assets \
            -I $ANDROID_JAR \
            -F build/bin/unaligned.apk build/bin/

      - name: ZipAlign & Sign APK
        run: |
          echo "=== 1. ZipAligning APK to 4-byte boundary ==="
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 build/bin/unaligned.apk build/bin/aligned.apk

          echo "=== 2. Creating Keystore ==="
          keytool -genkey -v -keystore release.keystore \
            -alias makkalnalan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AyyappaPravin, OU=CitizenAI, O=MakkalNalan, L=Chennai, S=TN, C=IN"
          
          echo "=== 3. Signing APK with V1/V2/V3 schemes ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out MakkalNalan.apk \
            build/bin/aligned.apk
          
          echo "=== 4. Verifying Signed APK ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose MakkalNalan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakkalNalan-APK
          path: MakkalNalan.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.1"
          files: MakkalNalan.apk
          name: "Makkal Nalan AI v1.0.1"
          body: |
            ## 🏛️ Makkal Nalan AI - Universal Compatibility Release v1.0.1 (மக்கள் நலன்)
            
            Fixed device compatibility across all modern Android versions (Android 7.0 - 15+):
            - **Explicit SDK Versioning**: `minSdkVersion="24"`, `targetSdkVersion="34"`.
            - **Clean DEX Packaging**: Recompiled bytecode with Java 8 compatibility and D8 Dexing.
            - **Full V1, V2, and V3 Dual Scheme Signatures**: 4-byte ZipAligned.
            - **Bilingual Interface**: தமிழ் (Tamil) and English.
            - **100% Offline & Universal Ready**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
