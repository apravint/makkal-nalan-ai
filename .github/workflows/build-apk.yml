name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Unsigned APK
        run: |
          mkdir -p build/gen build/obj build/bin assets/web
          cp -r web/* assets/
          cp -r web/* assets/web/
          
          # Detect highest available android.jar
          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            export ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar
          else
            export ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          fi
          echo "Using Android JAR: $ANDROID_JAR"
          
          echo "=== 1. Compiling Android Resources ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m \
            -J build/gen \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -I $ANDROID_JAR
          
          echo "=== 2. Compiling Java Source Files ==="
          find android/app/src/main/java build/gen -name "*.java" > sources.txt
          javac -d build/obj \
            -classpath $ANDROID_JAR \
            -source 1.8 -target 1.8 \
            @sources.txt
          
          echo "=== 3. Converting Bytecode to DEX ==="
          find build/obj -name "*.class" > classes.txt
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --output build/bin/ \
            --lib $ANDROID_JAR \
            $(cat classes.txt)
          
          echo "=== 4. Packaging Unaligned APK ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -A assets \
            -I $ANDROID_JAR \
            -F build/bin/unaligned.apk build/bin/

      - name: ZipAlign & Sign APK
        run: |
          echo "=== 1. ZipAligning APK to 4-byte boundary ==="
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 build/bin/unaligned.apk build/bin/aligned.apk

          echo "=== 2. Creating Keystore ==="
          keytool -genkey -v -keystore release.keystore \
            -alias makkalnalan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AyyappaPravin, OU=CitizenAI, O=MakkalNalan, L=Chennai, S=TN, C=IN"
          
          echo "=== 3. Signing APK with V1/V2/V3 schemes ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out MakkalNalan.apk \
            build/bin/aligned.apk
          
          echo "=== 4. Verifying Signed APK ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose MakkalNalan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakkalNalan-APK
          path: MakkalNalan.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.1.0"
          files: MakkalNalan.apk
          name: "Makkal Nalan AI v1.1.0"
          body: |
            ## 🏛️ Makkal Nalan AI v1.1.0 (மக்கள் நலன்)
            
            Major feature and ecosystem upgrade for Android & Web:
            - **Expanded Welfare Database**: 18 comprehensive state and central schemes across 9 categories (Kalaignar Kanavu Illam, Makkalai Thedi Maruthuvam, Selvamagal Semippu, Thalikku Thangam, PMAY, PM Vishwakarma, AABCS, Vidiyal Payanam, and more).
            - **Target SDK 35 (Android 15)**: Full edge-to-edge transparent system bars, window insets, and predictive back gestures (`android:enableOnBackInvokedCallback="true"`).
            - **Bookmark & Pinned Schemes**: Save schemes locally to present at e-Sevai centers or Taluk offices.
            - **Printable Application Slip**: Print-friendly checklist slip generator.
            - **Progressive Web App (PWA)**: Offline service worker, manifest, and live GitHub Pages web edition.
            - **Universal V1, V2, and V3 Dual Scheme Signatures**: 4-byte ZipAligned.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
